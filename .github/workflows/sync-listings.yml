name: Sync Listings

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Clear listings cache
        run: echo "[]" > src/data/listings.json

      - name: Fetch listings
        run: node src/data/fetch-listings.js

      - name: Process and tag listings
        run: node src/data/process-listings.js

      - name: Update last synced timestamp
        run: |
          DATE=$(TZ=America/Los_Angeles date '+%B %-d, %Y %-I:%M %p PT')
          echo "{\"lastSynced\": \"$DATE\"}" > src/data/sync-meta.json

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/listings-update
          title: "sync: update listings"
          body: |
            Automated listings sync — triggered manually via Actions.

            - Cleared and re-fetched all listings
            - Re-processed and re-tagged listings
            - Updated last synced timestamp

            Review the diff and merge when ready.
          commit-message: "sync: update listings"
          delete-branch: true
